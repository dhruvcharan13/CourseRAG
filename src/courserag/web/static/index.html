<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CourseRAG</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161920;
    --panel-2: #1c2029;
    --line: #272c38;
    --text: #e6e8ee;
    --muted: #8b93a7;
    --accent: #6ea8fe;
    --ok: #4ec9a5;
    --warn: #e0a458;
    --danger: #e06c75;
    --radius: 10px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --panel: #fff; --panel-2: #f0f2f6; --line: #dfe3ea;
      --text: #1b1f28; --muted: #667085; --accent: #2f6fd0;
      --ok: #12855f; --warn: #a4671b; --danger: #c0392b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  header .spacer { flex: 1; }
  /* Two columns normally; a third opens for the viewer. The middle column's width is
     a CSS variable so the splitter can drag it without touching the other tracks. */
  main { flex: 1; display: grid; grid-template-columns: 240px 1fr; min-height: 0; }
  main.viewing { grid-template-columns: 240px var(--list-w, 420px) 5px 1fr; }

  /* ---- sidebar ---- */
  aside {
    border-right: 1px solid var(--line); background: var(--panel);
    display: flex; flex-direction: column; min-height: 0;
  }
  .aside-head {
    padding: 12px 14px 8px; font-size: 11px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted);
  }
  .courses { overflow-y: auto; flex: 1; padding: 0 8px 8px; }
  .course {
    display: flex; align-items: baseline; gap: 8px; width: 100%;
    padding: 8px 10px; border: 0; border-radius: 8px; background: transparent;
    color: var(--text); cursor: pointer; text-align: left; font: inherit;
  }
  .course:hover { background: var(--panel-2); }
  .course[aria-current="true"] { background: var(--panel-2); box-shadow: inset 2px 0 0 var(--accent); }
  .course .name { flex: 1; font-weight: 500; }
  .course .count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .aside-foot { padding: 8px; border-top: 1px solid var(--line); }

  /* ---- content ---- */
  section { overflow-y: auto; padding: 18px 22px 40px; min-height: 0; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .course-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 4px; }
  .course-head h2 { margin: 0; font-size: 20px; }
  .meta { color: var(--muted); font-size: 12.5px; margin: 2px 0 16px; }
  .meta code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }

  /* ---- drop zone ---- */
  .drop {
    border: 1.5px dashed var(--line); border-radius: var(--radius);
    padding: 26px; text-align: center; color: var(--muted);
    background: var(--panel); transition: border-color .12s, background .12s;
    cursor: pointer; margin-bottom: 18px;
  }
  .drop:hover { border-color: var(--accent); }
  .drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--panel)); color: var(--text); }
  .drop strong { color: var(--text); display: block; margin-bottom: 4px; font-weight: 600; }

  /* ---- file table ---- */
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; font-size: 11px; letter-spacing: .07em; text-transform: uppercase;
    color: var(--muted); font-weight: 500; padding: 0 10px 6px; border-bottom: 1px solid var(--line);
  }
  td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); width: 90px; }
  td.act { width: 34px; text-align: right; }
  .tag {
    display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11.5px;
    background: var(--panel-2); color: var(--muted); border: 1px solid var(--line);
  }
  /* The category is editable, so it is a real select — dressed as the tag it replaces
     rather than as a form control, since a table of dropdowns reads as noise. */
  select.cat {
    font-family: inherit; padding: 1px 18px 1px 7px; cursor: pointer;
    appearance: none; -webkit-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                      linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 9px) 52%, calc(100% - 5px) 52%;
    background-size: 4px 4px, 4px 4px;
    background-repeat: no-repeat;
  }
  select.cat:hover { color: var(--text); border-color: var(--accent); }

  /* ---- edit mode ---- */
  button.toggle[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: #06101f; font-weight: 600;
  }
  /* The whole table shifts rather than each control deciding for itself, so read-only
     really is read-only: nothing destructive is even in the DOM. */
  table:not(.editing) td.act { display: none; }
  table:not(.editing) th.act { display: none; }
  input.rename {
    font: inherit; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; width: 100%;
    max-width: 30ch;
  }
  input.rename:focus { outline: none; border-color: var(--accent); }
  input.rename.dirty { border-color: var(--warn); }
  .pill { font-size: 11px; padding: 1px 6px; border-radius: 4px; margin-left: 6px; }
  .pill.pending { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .pill.missing { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }

  button {
    font: inherit; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 7px; padding: 5px 11px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #06101f; font-weight: 600; }
  button.icon { padding: 3px 8px; background: transparent; border-color: transparent; color: var(--muted); }
  button.icon:hover { color: var(--danger); border-color: var(--line); }

  /* ---- job log ---- */
  .job {
    margin: 16px 0; border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--panel); overflow: hidden;
  }
  .job-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; }
  .job-head .label { font-weight: 600; }
  .bar { height: 3px; background: var(--panel-2); }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .25s; }
  .job pre {
    margin: 0; padding: 10px 14px; max-height: 190px; overflow-y: auto;
    font: 12px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted);
    border-top: 1px solid var(--line);
  }
  .notice {
    padding: 9px 12px; border-radius: 8px; margin-bottom: 14px; font-size: 13px;
    border: 1px solid; background: var(--panel);
  }
  .notice.warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); color: var(--warn); }
  .notice.err  { border-color: color-mix(in srgb, var(--danger) 45%, var(--line)); color: var(--danger); }
  .spin {
    width: 12px; height: 12px; border: 2px solid var(--line);
    border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- file viewer ---- */
  .name-btn {
    background: none; border: 0; padding: 0; font: inherit; color: var(--text);
    cursor: pointer; text-align: left; border-bottom: 1px solid transparent;
  }
  .name-btn:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .name-btn:disabled { color: var(--muted); cursor: default; border-bottom-color: transparent; }

  /* The viewer is a pane in the grid, not an overlay: the list stays usable beside it. */
  #viewer[hidden], #splitter[hidden] { display: none; }
  #viewer {
    display: flex; flex-direction: column; min-width: 0; min-height: 0;
    border-left: 1px solid var(--line); background: var(--panel);
  }
  .viewer-head {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-bottom: 1px solid var(--line); flex: none;
  }
  .viewer-head .title {
    font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .viewer-head .spacer { flex: 1; }
  .viewer-body { flex: 1; min-height: 0; background: var(--panel-2); }
  .viewer-body iframe { width: 100%; height: 100%; border: 0; display: block; }

  #splitter { cursor: col-resize; background: transparent; }
  #splitter:hover, #splitter.dragging { background: var(--accent); }
  body.resizing { cursor: col-resize; user-select: none; }
  /* While dragging, the iframe would swallow the mouse events. */
  body.resizing iframe { pointer-events: none; }

  /* Beside the viewer the list drops to name + category; size and chunk counts are
     detail you want when surveying a course, not when reading one document. */
  table.condensed th:nth-child(3), table.condensed td:nth-child(3),
  table.condensed th:nth-child(4), table.condensed td:nth-child(4) { display: none; }
  tr.active { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  tr.active .name-btn { color: var(--accent); font-weight: 600; }
  a.btnlink {
    font: inherit; color: var(--text); background: var(--panel-2); text-decoration: none;
    border: 1px solid var(--line); border-radius: 7px; padding: 5px 11px;
  }
  a.btnlink:hover { border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>CourseRAG</h1>
  <span class="spacer"></span>
  <span id="globalNote" class="meta" style="margin:0"></span>
</header>

<main id="main">
  <aside>
    <div class="aside-head">Courses</div>
    <div class="courses" id="courseList"></div>
    <div class="aside-foot"><button id="newCourse" style="width:100%">+ New course</button></div>
  </aside>

  <section id="detail"><div class="empty">Select a course, or create one.</div></section>

  <div id="splitter" hidden></div>

  <section id="viewer" hidden>
    <div class="viewer-head">
      <span class="title" id="viewerName"></span>
      <span class="meta" style="margin:0" id="viewerMeta"></span>
      <span class="spacer"></span>
      <a class="btnlink" id="viewerTab" target="_blank" rel="noopener">Open in tab</a>
      <button id="viewerClose" title="Close (Esc)">&#10005;</button>
    </div>
    <div class="viewer-body" id="viewerBody"></div>
  </section>
</main>

<input type="file" id="filePick" multiple hidden>

<script>
"use strict";

const $ = (sel, root = document) => root.querySelector(sel);
const state = {
  courses: [], current: null, detail: null, poll: null, extensions: [],
  viewing: null,   // basename of the file open in the right-hand pane
  editing: false,  // course page is read-only until this is on
};

const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const fmtSize = (n) => n == null ? "" :
  n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(0)} KB` : `${(n / 1048576).toFixed(1)} MB`;

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail ?? detail; } catch { /* non-JSON error body */ }
    throw new Error(detail);
  }
  return res.status === 204 ? null : res.json();
}

function note(msg, kind = "err") {
  const el = $("#globalNote");
  el.textContent = msg;
  el.style.color = kind === "err" ? "var(--danger)" : "var(--muted)";
  if (msg) setTimeout(() => { if (el.textContent === msg) el.textContent = ""; }, 6000);
}

// ---------------------------------------------------------------- sidebar --

async function loadCourses() {
  const data = await api("/api/courses");
  state.courses = data.courses;
  state.extensions = data.extensions;
  const list = $("#courseList");
  list.innerHTML = "";
  if (!state.courses.length) {
    list.innerHTML = '<div class="empty" style="padding:20px 0;font-size:13px">No courses yet.</div>';
  }
  for (const c of state.courses) {
    const btn = document.createElement("button");
    btn.className = "course";
    btn.setAttribute("aria-current", String(c.id === state.current));
    btn.innerHTML =
      `<span class="name">${esc(c.id)}</span>` +
      (c.busy ? '<span class="spin"></span>' : `<span class="count">${c.chunks.toLocaleString()}</span>`);
    btn.onclick = () => select(c.id);
    list.appendChild(btn);
  }
}

async function select(id) {
  // The open document belongs to the course being left, so it does not survive the move.
  if (id !== state.current) closeViewer();
  state.current = id;
  await loadCourses();
  await refresh();
}

// ----------------------------------------------------------------- detail --

async function refresh() {
  if (!state.current) return;
  try {
    state.detail = await api(`/api/courses/${encodeURIComponent(state.current)}`);
  } catch (e) {
    note(e.message);
    return;
  }
  render();
  const job = state.detail.job;
  if (job && !job.done) startPolling(job.id);
}

function render() {
  const d = state.detail;
  if (!d) return;
  const onDisk = d.files.filter((f) => f.on_disk).length;
  const pending = d.files.filter((f) => f.on_disk && !f.indexed).length;
  const missing = d.files.filter((f) => !f.on_disk && f.indexed).length;

  // Every category the course knows, from stored chunks and from the folder tree
  // alike — a folder holding only unsynced files is still a category you can move to.
  const cats = [...new Set([...(d.categories || []), ...d.files.map((f) => f.category)])]
    .filter(Boolean).sort();

  const rows = d.files.map((f) => {
    let flag = "";
    if (f.on_disk && !f.indexed) flag = '<span class="pill pending">not indexed</span>';
    else if (!f.on_disk && f.indexed) flag = '<span class="pill missing">file missing</span>';
    // Only a file still on disk can be opened or edited; one that is indexed but
    // missing has nothing to show, so the name is inert rather than a link to a 404.
    const openable = f.on_disk;
    const nameCell = state.editing && openable
      ? `<input class="rename" data-rename="${esc(f.name)}" value="${esc(f.name)}"
             spellcheck="false" aria-label="File name">`
      : `<button class="name-btn" data-view="${esc(f.name)}" ${openable ? "" : "disabled"}
             title="${openable ? "Open" : "File is not on disk"}">${esc(f.name)}</button>`;
    const catCell = !openable ? ""
      : state.editing ? catSelect(f, cats)
      : `<span class="tag">${esc(f.category)}</span>`;
    return `<tr>
      <td>${nameCell}${flag}</td>
      <td>${catCell}</td>
      <td class="num">${fmtSize(f.size)}</td>
      <td class="num">${f.chunks ? f.chunks.toLocaleString() : "&mdash;"}</td>
      <td class="act">
        ${openable ? `<button class="icon" data-view="${esc(f.name)}" title="Open">&#8599;</button>` : ""}
        <button class="icon" data-del="${esc(f.name)}" title="Remove from course">&#10005;</button>
      </td>
    </tr>`;
  }).join("");

  const notices = [];
  for (const [name, rels] of Object.entries(d.duplicates || {})) {
    notices.push(`<div class="notice err">Duplicate name <b>${esc(name)}</b> at ${esc(rels.join(", "))}
      — chunks are keyed by file name, so neither is indexed. Rename one.</div>`);
  }
  if (d.unsupported?.length) {
    notices.push(`<div class="notice warn">${d.unsupported.length} file(s) in the folder have no parser
      and are ignored: ${esc(d.unsupported.slice(0, 6).join(", "))}${d.unsupported.length > 6 ? "…" : ""}</div>`);
  }
  if (pending || missing) {
    const bits = [pending && `${pending} not indexed`, missing && `${missing} missing from disk`].filter(Boolean);
    notices.push(`<div class="notice warn">${bits.join(", ")} — run Sync to reconcile.</div>`);
  }

  $("#detail").innerHTML = `
    <div class="course-head">
      <div style="flex:1">
        <h2>${esc(d.id)}</h2>
        <div class="meta">
          ${d.chunks.toLocaleString()} chunks &middot; ${onDisk} file(s) in
          <code>${esc(d.source_dir)}</code><br>
          <code>${esc(d.embedding_model)}</code> &middot; ${d.dims}d
          ${d.last_indexed ? "&middot; last indexed " + esc(d.last_indexed.slice(0, 16).replace("T", " ")) : ""}
        </div>
      </div>
      <a class="btnlink" id="exportBtn"
         href="/api/courses/${encodeURIComponent(d.id)}/export"
         title="Download this course as a shareable zip">Export</a>
      <button class="toggle" id="editBtn" aria-pressed="${state.editing}"
              title="Rename files and change categories">${state.editing ? "Done" : "Edit"}</button>
      <button id="syncBtn">Sync</button>
    </div>
    ${notices.join("")}
    <div class="drop" id="drop">
      <strong>Drop PDFs or a folder here</strong>
      A folder becomes a category. Supported: ${state.extensions.join(", ")}
    </div>
    <div id="jobBox"></div>
    ${d.files.length ? `<table class="${state.editing ? "editing" : ""}">
      <thead><tr><th>File</th><th>Category</th><th class="num">Size</th><th class="num">Chunks</th><th class="act"></th></tr></thead>
      <tbody>${rows}</tbody></table>` : '<div class="empty">Nothing in this course yet.</div>'}
  `;

  $("#syncBtn").onclick = doSync;
  $("#editBtn").onclick = () => {
    // Commit whatever is in a focused rename box before the table is rebuilt, or
    // clicking Done would quietly discard a name the user just typed.
    const open = document.activeElement;
    if (open?.dataset?.rename) open.blur();
    state.editing = !state.editing;
    render();
  };
  wireDropZone($("#drop"));
  for (const btn of document.querySelectorAll("[data-del]")) {
    btn.onclick = () => removeFile(btn.dataset.del);
  }
  for (const btn of document.querySelectorAll("[data-view]")) {
    btn.onclick = () => viewFile(btn.dataset.view);
  }
  for (const sel of document.querySelectorAll("[data-cat]")) {
    sel.onchange = () => changeCategory(sel.dataset.cat, sel.value, sel);
  }
  for (const box of document.querySelectorAll("[data-rename]")) {
    box.oninput = () => box.classList.toggle("dirty", box.value !== box.dataset.rename);
    box.onkeydown = (e) => {
      if (e.key === "Enter") { e.preventDefault(); box.blur(); }
      // Escape abandons the edit rather than committing a half-typed name.
      if (e.key === "Escape") { box.value = box.dataset.rename; box.classList.remove("dirty"); box.blur(); }
    };
    box.onblur = () => renameFile(box.dataset.rename, box.value, box);
  }
  if (state.detail.job) renderJob(state.detail.job);

  // render() replaces the whole pane, so the viewer's effect on it is reapplied here
  // rather than being lost to the next background refresh. If the open file has since
  // left the folder — deleted here, or in Finder — the pane closes instead.
  const open = state.viewing && d.files.find((f) => f.name === state.viewing && f.on_disk);
  if (state.viewing && !open) closeViewer();
  else { showViewer(Boolean(state.viewing)); markActiveRow(); }
}

/** The category cell: a select styled as the tag it replaces. */
function catSelect(file, cats) {
  const options = [...new Set([...cats, file.category])].filter(Boolean).sort()
    .map((c) => `<option value="${esc(c)}"${c === file.category ? " selected" : ""}>${esc(c)}</option>`)
    .join("");
  return `<select class="tag cat" data-cat="${esc(file.name)}" title="Move to another category">
    ${options}<option value="__new__">New category…</option></select>`;
}

async function renameFile(name, value, box) {
  const wanted = value.trim();
  if (!wanted || wanted === name) { box.value = name; box.classList.remove("dirty"); return; }

  const form = new FormData();
  form.append("new_name", wanted);
  try {
    const res = await api(`/api/courses/${encodeURIComponent(state.current)}/files/${encodeURIComponent(name)}`,
      { method: "PATCH", body: form });
    // The pane is showing a file that no longer exists under that name.
    if (state.viewing === name) closeViewer();
    box.classList.remove("dirty");
    if (res.job) { renderJob(res.job); startPolling(res.job.id); }
  } catch (e) {
    note(e.message);
    box.value = name;
    box.classList.remove("dirty");
  }
}

async function changeCategory(name, value, select) {
  const current = state.detail.files.find((f) => f.name === name)?.category ?? "";
  let category = value;
  if (value === "__new__") {
    category = prompt(`Move "${name}" to which category?`, current);
    // Cancelled, or unchanged: put the select back rather than leaving it on the sentinel.
    if (!category || category === current) { select.value = current; return; }
  }
  const form = new FormData();
  form.append("category", category);
  try {
    const res = await api(`/api/courses/${encodeURIComponent(state.current)}/files/${encodeURIComponent(name)}`,
      { method: "PATCH", body: form });
    if (res.job) { renderJob(res.job); startPolling(res.job.id); }
  } catch (e) {
    note(e.message);
    select.value = current;
  }
}

// ------------------------------------------------------------------- viewer --

/** Open one source file in the right-hand pane, rendered by the browser's own viewer. */
function viewFile(name) {
  const file = state.detail?.files.find((f) => f.name === name);
  if (!file?.on_disk) return;
  if (state.viewing === name) return closeViewer();   // clicking the open file closes it

  const url = `/api/courses/${encodeURIComponent(state.current)}/raw/${encodeURIComponent(name)}`;
  state.viewing = name;
  $("#viewerName").textContent = name;
  $("#viewerName").title = name;
  $("#viewerMeta").textContent =
    [file.category, fmtSize(file.size), file.chunks ? `${file.chunks} chunks` : "not indexed"]
      .filter(Boolean).join(" · ");
  $("#viewerTab").href = url;
  // Rebuild the iframe each time rather than reassigning src: swapping the src of a
  // live PDF viewer leaves the previous document's scroll position and, in Safari,
  // sometimes the previous document.
  $("#viewerBody").innerHTML = `<iframe src="${url}" title="${esc(name)}"></iframe>`;
  showViewer(true);
  markActiveRow();
}

function closeViewer() {
  state.viewing = null;
  $("#viewerBody").innerHTML = "";   // stop a hidden PDF from rendering
  showViewer(false);
  markActiveRow();
}

function showViewer(on) {
  $("#viewer").hidden = !on;
  $("#splitter").hidden = !on;
  $("#main").classList.toggle("viewing", on);
  const table = document.querySelector("#detail table");
  if (table) table.classList.toggle("condensed", on);
}

/** Highlight the row whose file is open, without re-rendering the table. */
function markActiveRow() {
  for (const btn of document.querySelectorAll("[data-view]")) {
    btn.closest("tr")?.classList.toggle("active", btn.dataset.view === state.viewing);
  }
}

$("#viewerClose").onclick = closeViewer;
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && state.viewing) closeViewer();
});

// ---- splitter: drag the boundary between the list and the viewer ----

$("#splitter").addEventListener("pointerdown", (e) => {
  e.preventDefault();
  const main = $("#main");
  const sidebar = main.firstElementChild.getBoundingClientRect().width;
  const splitter = $("#splitter");
  splitter.classList.add("dragging");
  document.body.classList.add("resizing");
  splitter.setPointerCapture(e.pointerId);

  const onMove = (ev) => {
    // Clamp so neither pane can be dragged away entirely.
    const w = Math.min(Math.max(ev.clientX - main.getBoundingClientRect().left - sidebar, 240),
                       main.clientWidth - sidebar - 320);
    main.style.setProperty("--list-w", `${w}px`);
  };
  const onUp = () => {
    splitter.classList.remove("dragging");
    document.body.classList.remove("resizing");
    splitter.removeEventListener("pointermove", onMove);
    splitter.removeEventListener("pointerup", onUp);
  };
  splitter.addEventListener("pointermove", onMove);
  splitter.addEventListener("pointerup", onUp);
});

// -------------------------------------------------------------- job polling --

function renderJob(job) {
  const box = $("#jobBox");
  if (!box) return;
  const pct = Math.round((job.progress ?? 0) * 100);
  box.innerHTML = `<div class="job">
    <div class="job-head">
      ${job.done ? "" : '<span class="spin"></span>'}
      <span class="label">${esc(job.label)}</span>
      <span class="meta" style="margin:0">${job.state}</span>
    </div>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <pre>${esc(job.lines.join("\n")) || "…"}</pre>
  </div>`;
  const pre = box.querySelector("pre");
  if (pre) pre.scrollTop = pre.scrollHeight;
}

function startPolling(jobId) {
  clearInterval(state.poll);
  state.poll = setInterval(async () => {
    let job;
    try {
      job = await api(`/api/jobs/${jobId}`);
    } catch (e) {
      clearInterval(state.poll);
      note(e.message);
      return;
    }
    renderJob(job);
    if (job.done) {
      clearInterval(state.poll);
      if (job.error) note(job.error);
      await loadCourses();
      const finished = state.detail;
      await refresh();
      // Keep the finished log on screen; refresh() clears it when the job is gone.
      if (finished) renderJob(job);
    }
  }, 600);
}

// ------------------------------------------------------------------ actions --

async function doSync() {
  const btn = $("#syncBtn");
  if (btn) btn.disabled = true;
  try {
    const { job } = await api(`/api/courses/${encodeURIComponent(state.current)}/sync`, { method: "POST" });
    renderJob(job);
    startPolling(job.id);
  } catch (e) {
    note(e.message);
    if (btn) btn.disabled = false;
  }
}

async function removeFile(name) {
  if (!confirm(`Remove "${name}" from ${state.current}?\n\nIts chunks are deleted and the file is removed from the course folder.`)) return;
  try {
    await api(`/api/courses/${encodeURIComponent(state.current)}/files/${encodeURIComponent(name)}`,
      { method: "DELETE" });
    await loadCourses();
    await refresh();
  } catch (e) { note(e.message); }
}

async function upload(entries) {
  if (!entries.length) return;
  const form = new FormData();
  for (const { file, path } of entries) {
    form.append("files", file, file.name);
    form.append("paths", path || file.name);
  }
  try {
    const res = await api(`/api/courses/${encodeURIComponent(state.current)}/files`,
      { method: "POST", body: form });
    if (res.skipped?.length) note(`Skipped (no parser): ${res.skipped.join(", ")}`, "err");
    if (res.job) { renderJob(res.job); startPolling(res.job.id); }
    else await refresh();
  } catch (e) { note(e.message); }
}

// ---- drag & drop, including whole folders (Chrome/Safari/Edge/Firefox) ----

/** Walk a dropped directory tree, yielding files with their relative paths. */
async function walkEntry(entry, prefix = "") {
  if (entry.isFile) {
    const file = await new Promise((res, rej) => entry.file(res, rej));
    return [{ file, path: prefix + file.name }];
  }
  const reader = entry.createReader();
  const children = [];
  // readEntries returns at most ~100 at a time; keep reading until it returns none.
  for (;;) {
    const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
    if (!batch.length) break;
    children.push(...batch);
  }
  const out = [];
  for (const child of children) {
    if (child.name.startsWith(".")) continue;
    out.push(...await walkEntry(child, `${prefix}${entry.name}/`));
  }
  return out;
}

function wireDropZone(zone) {
  if (!zone) return;
  const stop = (e) => { e.preventDefault(); e.stopPropagation(); };
  zone.addEventListener("dragover", (e) => { stop(e); zone.classList.add("over"); });
  zone.addEventListener("dragleave", (e) => { stop(e); zone.classList.remove("over"); });
  zone.addEventListener("drop", async (e) => {
    stop(e);
    zone.classList.remove("over");
    const items = [...(e.dataTransfer.items || [])]
      .map((i) => i.webkitGetAsEntry?.())
      .filter(Boolean);
    let entries = [];
    if (items.length) {
      for (const entry of items) entries.push(...await walkEntry(entry));
    } else {
      entries = [...e.dataTransfer.files].map((file) => ({ file, path: file.name }));
    }
    await upload(entries);
  });
  zone.addEventListener("click", () => {
    const picker = $("#filePick");
    picker.value = "";
    picker.onchange = () => upload([...picker.files].map((file) => ({ file, path: file.name })));
    picker.click();
  });
}

// -------------------------------------------------------------------- init --

$("#newCourse").onclick = async () => {
  const id = prompt("Course id (e.g. CS247):");
  if (!id) return;
  const form = new FormData();
  form.append("course_id", id.trim());
  try {
    const created = await api("/api/courses", { method: "POST", body: form });
    await select(created.id);
  } catch (e) { note(e.message); }
};

// Files changed outside the browser (Finder, a git pull) show up within a few seconds.
// Paused while editing: refresh() rebuilds the table, which would wipe a half-typed
// name out from under the cursor. Changes made elsewhere appear on Done.
setInterval(() => {
  if (state.current && !state.poll && !state.editing) refresh();
}, 5000);

(async () => {
  await loadCourses();
  if (state.courses.length) await select(state.courses[0].id);
})();
</script>
